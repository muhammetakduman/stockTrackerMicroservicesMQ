spring:
  application:
    name: sales-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:sales_db}
    username: ${DB_USERNAME:sales_user}
    password: ${DB_PASSWORD:sales_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/dev-public.pem


server:
  port: 8083


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always


app:
  messaging:

    sale:
      exchange: sale.exchange
      routing-key: sale.created

    stock-result:
      exchange: stock.result.exchange

      completed-routing-key: stock.decrease.completed
      failed-routing-key: stock.decrease.failed

      completed-queue: sales.stock-decrease-completed.queue
      failed-queue: sales.stock-decrease-failed.queue

      dead-letter-exchange: sales.stock-result.dlx

      completed-dlq: sales.stock-decrease-completed.dlq
      failed-dlq: sales.stock-decrease-failed.dlq

      completed-dead-letter-routing-key: stock.decrease.completed.dead
      failed-dead-letter-routing-key: stock.decrease.failed.dead


  outbox:
    publisher:
      fixed-delay-ms: 2000
      batch-size: 20
      max-attempts: 5
      confirm-timeout-ms: 5000